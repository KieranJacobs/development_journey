<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Project Manager 4.0</title>
  </head>
  <body>
    <h1>{{ dynamic_title }}</h1>

    <h2>Create New Project</h2>
    <form action="/" method="POST">
      <label for="title">Project Title:</label>
      <input type="text" id="title" name="title" required />

      <label for="status">Status:</label>
      <select id="status" name="status">
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Complete">Complete</option>
      </select>

      <button type="submit">Add Project</button>
    </form>

    <hr />

    <h2>Current Projects:</h2>
    <ul>
      {% for project in projects %}
      <li>
        <a href="{{ url_for('view_project', project_id=project.id) }}">
          <strong>{{ project.title }}</strong>
        </a>
        - Status: {{ project.status }}

        <form
          action="{{ url_for('delete_project', project_id=project.id) }}"
          method="POST"
          style="display: inline"
        >
          <button
            type="submit"
            onclick="return confirm('Are you sure you want to delete {{ project.title }} and all its tasks?');"
          >
            Delete
          </button>
        </form>
      </li>
      {% endfor %}
    </ul>
  </body>
</html>
